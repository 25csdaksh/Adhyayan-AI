# ==============================================================================
# StudyLM Production Nginx Reverse Proxy Configuration
# ==============================================================================

upstream studylm_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=billing_limit:10m rate=10r/s;

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name app.studylm.ai api.studylm.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Backend API Server (api.studylm.ai)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.studylm.ai;

    # TLS Certificates
    ssl_certificate /etc/letsencrypt/live/api.studylm.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.studylm.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Max upload size (PDFs, DOCX)
    client_max_body_size 50M;

    # Webhook endpoint (Strict preservation of raw payload for signature verification)
    location /api/billing/webhook {
        limit_req zone=billing_limit burst=20 nodelay;
        proxy_pass http://studylm_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Auth Rate Limiting
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://studylm_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # General API Routing
    location / {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://studylm_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s; # Long timeout for AI RAG / deep research synthesis
        proxy_connect_timeout 10s;
    }
}

# Frontend SPA Server (app.studylm.ai)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.studylm.ai;

    ssl_certificate /etc/letsencrypt/live/app.studylm.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.studylm.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/studylm-frontend/dist;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
